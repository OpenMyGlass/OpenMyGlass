# Generate the Xcode project with `xcodegen generate` after running ./build-core.sh.
name: OpenMyGlassCompanion
options:
  bundleIdPrefix: org.openmyglass
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: "NO"
    # The core is built for arm64 only (see build-core.sh).
    ARCHS: arm64
targets:
  OpenMyGlassCompanion:
    type: application
    platform: iOS
    sources:
      - path: Companion
      - path: build/generated/OmgCore.swift
    dependencies:
      - framework: build/OmgCoreFFI.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openmyglass.companion
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
