[package]
name = "omg-core"
description = "OpenMyGlass companion core: persistent identity + one-time pairing, mutual auth, and the session state machine (heartbeat/locale/status/notifications)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
omg-protocol = { path = "../omg-protocol" }
omg-transport = { path = "../omg-transport" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
futures.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
base64.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "io-util", "net", "time", "sync"] }
tempfile = "3"
