[package]
name = "omg-cli"
description = "OpenMyGlass companion CLI/daemon: identity, QR bootstrap, pairing, and the backbone link (status/heartbeat/locale/notifications), plus a simulated Glass peer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "omg"
path = "src/main.rs"

[dependencies]
omg-protocol = { path = "../omg-protocol" }
omg-transport = { path = "../omg-transport" }
omg-core = { path = "../omg-core" }
omg-qr = { path = "../omg-qr" }
tokio = { workspace = true, features = ["signal"] }
clap.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile = "3"
