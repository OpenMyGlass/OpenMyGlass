# OpenMyGlass companion — shared Rust core workspace.
#
# This workspace is the cross-platform heart of the companion (phone AND PC).
# See docs/companion-rust-core.md for the architecture rationale.
[workspace]
resolver = "2"
members = [
    "crates/omg-protocol",
    "crates/omg-transport",
    "crates/omg-core",
    "crates/omg-qr",
    "crates/omg-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "GPL-3.0-only"
repository = "https://github.com/OpenMyGlass/OpenMyGlass"
authors = ["OpenMyGlass contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "macros", "time", "sync"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
bytes = "1"
async-trait = "0.1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
getrandom = "0.2"
sha2 = "0.10"
base64 = "0.22"
qrcode = "0.14"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = true
