// OpenMyGlass bridge protocol, version 1: phone <-> OpenMyGlass bridge app on Glass.
// Framing: varint32 length + one Frame (same as the companion link). Used over RFCOMM, TCP and, later, BLE,
// so messages stay small (icons are sent once per hash, frames are capped at 64 KiB by the sender).
syntax = "proto3";

package openmyglass.v1;

option java_package = "org.openmyglass.protocol.v1";
option java_outer_classname = "Bridge";

message Frame {
  oneof body {
    Hello hello = 1;               // both directions, first frame each way
    NavState nav = 2;              // phone -> glass: current navigation state (absent fields = unknown)
    NavEnded nav_ended = 3;        // phone -> glass: navigation ended, remove the card
    Icon icon = 4;                 // phone -> glass: icon bytes for a hash
    IconRequest icon_request = 5;  // glass -> phone: icon hash not in the Glass cache
    NotificationPosted notification = 6;          // phone -> glass: new or changed notification
    NotificationRemoved notification_removed = 7; // phone -> glass: notification gone (dismissed anywhere)
    NotificationAction notification_action = 8;   // glass -> phone: the owner chose an action or Dismiss
    DictationStart dictation_start = 9;           // glass -> phone: the owner chose Reply and speaks
    AudioChunk audio_chunk = 10;                  // glass -> phone: dictation audio
    DictationEnd dictation_end = 11;              // glass -> phone: speech ended (or was cancelled)
    Transcript transcript = 12;                   // phone -> glass: the offline transcription, or why there is none
    ReplyConfirm reply_confirm = 13;              // glass -> phone: send or discard the transcript
    ReplyResult reply_result = 14;                // phone -> glass: whether the reply went out
    GlassStatus glass_status = 15;                // glass -> phone: charging / Wi-Fi changed (and on session start)
    MediaListRequest media_list_request = 16;     // phone -> glass
    MediaList media_list = 17;                    // glass -> phone: on request, and when new media appear
    MediaPullStart media_pull_start = 18;         // phone -> glass: open the media server for one pull
    MediaServer media_server = 19;                // glass -> phone: where to download (token valid for this pull)
    MediaServerUnavailable media_server_unavailable = 20; // glass -> phone
    MediaPullDone media_pull_done = 21;           // phone -> glass: close the media server
    MediaChunkRequest media_chunk_request = 22;   // phone -> glass: Bluetooth pull, one chunk at a time
    MediaChunk media_chunk = 23;                  // glass -> phone
    MediaDelete media_delete = 24;                // phone -> glass: saved and verified, delete (owner setting)
    MediaDeleted media_deleted = 25;              // glass -> phone
  }
}

message Hello {
  uint32 protocol_version = 1;     // 1
  string app_version = 2;
  repeated string capabilities = 3;
}

// Same numbering as org.openmyglass.core.nav.Maneuver (ordinal + 1, UNKNOWN = 0).
enum Maneuver {
  MANEUVER_UNKNOWN = 0;
  STRAIGHT = 1;
  LEFT = 2;
  SLIGHT_LEFT = 3;
  SHARP_LEFT = 4;
  RIGHT = 5;
  SLIGHT_RIGHT = 6;
  SHARP_RIGHT = 7;
  KEEP_LEFT = 8;
  KEEP_RIGHT = 9;
  U_TURN_LEFT = 10;
  U_TURN_RIGHT = 11;
  OFF_ROUTE = 12;
  ROUNDABOUT = 13;
  ROUNDABOUT_LEFT = 14;
  ARRIVE = 15;
}

message NavState {
  Maneuver maneuver = 1;
  optional int32 distance_m = 2;
  optional string instruction = 3;
  optional string street = 4;
  optional string eta = 5;
  string source = 6;               // "osmand" or "gmaps"
  optional bytes icon_sha256 = 7;  // maneuver icon, sent separately as Icon
}

message NavEnded {}

message Icon {
  bytes sha256 = 1;
  bytes png = 2;
}

message IconRequest {
  bytes sha256 = 1;
}

// A phone notification, already filtered and truncated by the phone (title 200, text 1000 code points, 3 actions).
message Notification {
  string key = 1;                  // StatusBarNotification key: identifies the notification in updates and actions
  string app_name = 2;
  string title = 3;
  string text = 4;
  int64 posted_at_ms = 5;
  optional bytes icon_sha256 = 6;  // app icon, sent separately as Icon
  repeated NotificationActionInfo actions = 7;
  bool wake = 8;                   // the owner allowed this notification to wake the screen
}

message NotificationActionInfo {
  uint32 index = 1;                // position in the phone notification's action list
  string title = 2;
  bool reply = 3;                  // has a RemoteInput: dictated reply (plan 5b)
}

message NotificationPosted {
  Notification notification = 1;
}

message NotificationRemoved {
  string key = 1;
}

message NotificationAction {
  string key = 1;
  oneof choice {
    uint32 action_index = 2;
    bool dismiss = 3;
  }
}

// Dictated replies (plan 5b). Audio is PCM 16-bit little-endian mono at sample_rate, in chunks of about 100 ms.
// A newer request_id replaces an older one; the phone forgets a request after 60 s.
// Free dictation (free = true): speech that is not a notification reply (a note, a voice command argument). key and
// action_index are ignored. DictationEnd must come within the 60 s (audio does not extend it); after that the phone
// sends nothing. The flow ends with the final Transcript: the phone forgets the request then, Glass sends no
// ReplyConfirm and no reply is sent. The phone lists "dictation-free" in its Hello when it supports this; an older
// phone ignores the field, transcribes anyway and waits for a ReplyConfirm until the request expires.
message DictationStart {
  uint32 request_id = 1;
  string key = 2;                  // notification key (unused when free)
  uint32 action_index = 3;         // the reply action's index on the phone (unused when free)
  uint32 sample_rate = 4;          // 16000
  bool free = 5;                   // free dictation, not a notification reply
}

message AudioChunk {
  uint32 request_id = 1;
  uint32 seq = 2;
  bytes pcm = 3;
}

message DictationEnd {
  uint32 request_id = 1;
  bool cancelled = 2;
}

message Transcript {
  uint32 request_id = 1;
  string text = 2;
  bool final = 3;
  string error = 4;                // non-empty: no usable transcript (no speech model, nothing heard, ...)
}

message ReplyConfirm {
  uint32 request_id = 1;
  bool send = 2;
}

message ReplyResult {
  uint32 request_id = 1;
  bool ok = 2;
  string message = 3;
}

// Photo and video sync (plan 6a). Media travel over Wi-Fi HTTP from Glass; the bridge carries only metadata and
// the per-pull token.
message GlassStatus {
  bool charging = 1;
  bool wifi = 2;
  string ip = 3;                   // Glass's Wi-Fi address, empty when not on Wi-Fi
}

message MediaListRequest {}

message MediaItem {
  string id = 1;                   // stable for the same file (path, size, mtime)
  string name = 2;
  bool video = 3;
  int64 size = 4;
  int64 taken_at_ms = 5;
}

message MediaList {
  repeated MediaItem items = 1;
}

message MediaPullStart {}

message MediaServer {
  string ip = 1;
  uint32 port = 2;
  string token = 3;                // GET http://ip:port/media/<id>?token=…; Range supported; X-Content-SHA256 header
}

message MediaServerUnavailable {
  string reason = 1;
}

message MediaPullDone {}

// Bluetooth fallback (plan 6b): on demand only, one chunk in flight, data ≤ 48 KiB so a frame stays < 64 KiB.
message MediaChunkRequest {
  string id = 1;
  int64 offset = 2;
  uint32 length = 3;
}

message MediaChunk {
  string id = 1;
  int64 offset = 2;
  bytes data = 3;                  // empty at the end of the file, or with an error
  int64 total = 4;
  string sha256 = 5;               // of the whole file, only in the chunk that reaches the end (hashing waits until then)
  string error = 6;
}

// The id names one version of a file (path, size, mtime): a changed file has another id and is not deleted.
message MediaDelete {
  string id = 1;
}

message MediaDeleted {
  string id = 1;
  bool ok = 2;
}
